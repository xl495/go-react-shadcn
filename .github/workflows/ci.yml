name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run Playwright smoke"
        type: boolean
        default: false

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache-dependency-path: server/go.sum
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          working-directory: server
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: go build -o server ./cmd/server

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run codegen:check
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start API
        working-directory: server
        env:
          CAPTCHA_DEBUG: "1"
          APP_ENV: development
        run: go run ./cmd/server &
      - name: Install admin, web, and e2e
        run: |
          npm ci --prefix admin
          npm ci --prefix web
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium
      - name: Start admin
        working-directory: admin
        run: npm run dev -- --host 127.0.0.1 --port 5173 &
      - name: Start web
        working-directory: web
        run: npm run dev -- --host 127.0.0.1 --port 5174 &
      - name: Playwright smoke
        working-directory: e2e
        env:
          E2E_ADMIN_URL: http://127.0.0.1:5173
          E2E_WEB_URL: http://127.0.0.1:5174
        run: npx playwright test
