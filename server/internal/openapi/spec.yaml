openapi: 3.0.3
info:
  title: Latch Admin API
  version: 1.0.0
  description: Go + Gin + Casbin admin backend
servers:
  - url: /api/v1
paths:
  /auth/captcha:
    get:
      summary: Issue captcha
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCaptcha"
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLoginResult"
  /auth/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUser"
  /auth/menus:
    get:
      summary: Menu tree for current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMenuNodes"
  /users:
    get:
      summary: List users (paginated, data-scoped)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUserPage"
  /logs:
    get:
      summary: List operation logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: username, in: query, schema: { type: string } }
        - { name: module, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOpLogPage"
  /logs/login:
    get:
      summary: List login logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: username, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLoginLogPage"
  /logs/api:
    get:
      summary: List API request logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: traceId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAPILogPage"
  /departments:
    get:
      summary: Department tree
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDepartments"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeBase:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        email: { type: string }
        phone: { type: string }
        gender: { type: string }
        department: { type: string }
        title: { type: string }
        remark: { type: string }
        status: { type: string }
        lastLoginAt: { type: string, nullable: true }
        lastLoginIp: { type: string }
        permissionCodes: { type: array, items: { type: string } }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        description: { type: string }
        dataScope: { type: string }
    MenuNode:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        kind: { type: string }
        routePath: { type: string }
        component: { type: string }
        icon: { type: string }
        sort: { type: integer }
        hidden: { type: boolean }
        children: { type: array, items: { $ref: "#/components/schemas/MenuNode" } }
    OpLog:
      type: object
      properties:
        id: { type: integer }
        traceId: { type: string }
        username: { type: string }
        module: { type: string }
        action: { type: string }
        path: { type: string }
        status: { type: integer }
        ip: { type: string }
        latencyMs: { type: integer }
        oldValue: { type: string }
        newValue: { type: string }
        createdAt: { type: string }
    LoginLog:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        ip: { type: string }
        userAgent: { type: string }
        location: { type: string }
        status: { type: string }
        failReason: { type: string }
        createdAt: { type: string }
    APILog:
      type: object
      properties:
        id: { type: integer }
        traceId: { type: string }
        username: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        latencyMs: { type: integer }
        createdAt: { type: string }
    Department:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        parentId: { type: integer, nullable: true }
        sort: { type: integer }
        children: { type: array, items: { $ref: "#/components/schemas/Department" } }
    PageMeta:
      type: object
      required: [items, total, page, pageSize]
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    LoginRequest:
      type: object
      required: [username, password, captchaId, captchaCode]
      properties:
        username: { type: string }
        password: { type: string }
        captchaId: { type: string }
        captchaCode: { type: string }
    CaptchaChallenge:
      type: object
      properties:
        captchaId: { type: string }
        image: { type: string }
    LoginResult:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string }
        user: { $ref: "#/components/schemas/User" }
    EnvelopeUser:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/User" }
    EnvelopeCaptcha:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/CaptchaChallenge" }
    EnvelopeLoginResult:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LoginResult" }
    EnvelopeMenuNodes:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/MenuNode" } }
    EnvelopeUserPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/User" } }
    EnvelopeOpLogPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/OpLog" } }
    EnvelopeLoginLogPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/LoginLog" } }
    EnvelopeAPILogPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/APILog" } }
    EnvelopeDepartments:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Department" } }
