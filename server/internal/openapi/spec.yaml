openapi: 3.0.3
info:
  title: gra Admin API
  version: 1.0.0
  description: Go + Gin + Casbin admin backend
servers:
  - url: /api/v1
paths:
  /auth/captcha:
    get:
      summary: Issue captcha
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCaptcha"
  /auth/settings:
    get:
      summary: Public auth settings for login and registration
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthSettings"
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLoginResult"
  /auth/register:
    post:
      summary: Register a web account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLoginResult"
  /auth/google:
    post:
      summary: Sign in or register with a Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLoginResult"
  /auth/forgot-password:
    post:
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSent"
  /auth/reset-password:
    post:
      summary: Reset password with email token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReset"
  /mail/test:
    post:
      summary: Queue a test email using SMTP settings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestMailRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSent"
  /mail/unsubscribe:
    post:
      summary: Opt out of marketing mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUnsubscribed"
  /mail/jobs:
    get:
      summary: List mail jobs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
        - { name: class, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMailJobPage"
  /mail/jobs/{id}/retry:
    post:
      summary: Re-queue a dead or canceled mail job
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
  /mail/jobs/{id}/cancel:
    post:
      summary: Cancel a queued mail job
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
  /mail/campaigns:
    get:
      summary: List mail templates
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMailCampaignPage"
    post:
      summary: Create a mail template
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailCampaignRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMailCampaign"
  /mail/campaigns/{id}:
    get:
      summary: Get a mail template
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMailCampaign"
    put:
      summary: Update or pause a mail template
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailCampaignRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMailCampaign"
    delete:
      summary: Delete a draft or paused campaign
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
  /mail/campaigns/{id}/schedule:
    post:
      summary: Schedule a campaign for fan-out
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCampaignRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMailCampaign"
  /auth/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUser"
  /auth/logout:
    post:
      summary: Sign out and revoke the current JWT
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
  /auth/menus:
    get:
      summary: Admin menu tree for current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMenuNodes"
  /auth/web-menus:
    get:
      summary: Web menu tree for current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMenuNodes"
  /auth/sessions:
    get:
      summary: List the current user's login sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOwnSessions"
  /auth/sessions/{id}:
    delete:
      summary: Revoke one of the current user's sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRevoked"
  /auth/login-logs:
    get:
      summary: Login logs for the current account
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLoginLogPage"
  /auth/google/bind:
    post:
      summary: Bind a Google account to the current user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUser"
  /auth/google/unbind:
    post:
      summary: Unbind Google after password or TOTP confirmation
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleUnbindRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUser"
  /users:
    get:
      summary: List users (paginated, data-scoped)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string }, description: Search username, nickname, email, phone, department, title, remark, last login IP }
        - { name: status, in: query, schema: { type: string } }
        - { name: gender, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - { name: roleId, in: query, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string }, description: admin or web }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUserPage"
  /users/batch-status:
    put:
      summary: Batch enable or disable users in the actor's data scope
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchStatusRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBatchStatus"
  /users/{id}/reset-password:
    post:
      summary: Reset a user's password and force a change on next login
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTemporaryPassword"
  /users/{id}/unlock:
    post:
      summary: Clear login lock on a user
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUser"
  /users/{id}/sessions:
    get:
      summary: List a user's login sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOwnSessions"
  /users/{id}/sessions/{sid}:
    delete:
      summary: Revoke one user session
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: sid, in: path, required: true, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRevoked"
  /online-sessions:
    get:
      summary: List online sessions across accounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOnlineSessions"
  /logs:
    get:
      summary: List operation logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: username, in: query, schema: { type: string } }
        - { name: module, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOpLogPage"
  /logs/login:
    get:
      summary: List login logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: username, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLoginLogPage"
  /logs/api:
    get:
      summary: List API request logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: traceId, in: query, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAPILogPage"
  /departments:
    get:
      summary: Department tree (paginated roots)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDepartmentPage"
  /roles:
    get:
      summary: List roles
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRolePage"
  /roles/{id}/copy:
    post:
      summary: Copy a role and its permissions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyRoleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRole"
  /permissions:
    get:
      summary: List permissions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePermissionPage"
  /dicts:
    get:
      summary: List dictionary types
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDictPage"
  /configs:
    get:
      summary: List system configs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: group, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfigPage"
  /dashboard/stats:
    get:
      summary: Dashboard counters
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDashboardStats"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeBase:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [0, 1]
          description: 0 success, 1 error
        message: { type: string }
        data: {}
        errorCode:
          type: integer
          description: Machine-readable application error when code is 1
    User:
      type: object
      required: [id, username, nickname, avatar, email, phone, gender, department, title, remark, status, timezone, marketingOptIn, roles]
      properties:
        id: { type: integer }
        username: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        email: { type: string }
        phone: { type: string }
        gender: { type: string }
        department: { type: string }
        title: { type: string }
        remark: { type: string }
        status: { type: string }
        timezone: { type: string }
        marketingOptIn: { type: boolean }
        kind: { type: string, description: "admin or web" }
        lastLoginAt: { type: string, nullable: true }
        lastLoginIp: { type: string }
        permissionCodes: { type: array, items: { type: string } }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        createdAt: { type: string }
        updatedAt: { type: string }
    Role:
      type: object
      required: [id, name, code, description]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        description: { type: string }
        dataScope: { type: string }
        permissionIds: { type: array, items: { type: integer } }
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    Permission:
      type: object
      required: [id, name, code, path, method, kind, description]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        path: { type: string }
        method: { type: string }
        kind: { type: string }
        description: { type: string }
        parentId: { type: integer, nullable: true }
        sort: { type: integer }
        icon: { type: string }
        routePath: { type: string }
        component: { type: string }
        hidden: { type: boolean }
    MenuNode:
      type: object
      required: [id, name, code, kind, routePath, component, icon, sort, hidden]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        kind: { type: string }
        routePath: { type: string }
        component: { type: string }
        icon: { type: string }
        sort: { type: integer }
        hidden: { type: boolean }
        permCode: { type: string }
        children: { type: array, items: { $ref: "#/components/schemas/MenuNode" } }
    OpLog:
      type: object
      required: [id, username, module, action, method, path, status, ip, latencyMs, createdAt]
      properties:
        id: { type: integer }
        traceId: { type: string }
        username: { type: string }
        module: { type: string }
        action: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        ip: { type: string }
        latencyMs: { type: integer }
        detail: { type: string }
        description: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        createdAt: { type: string }
    LoginLog:
      type: object
      required: [id, username, ip, userAgent, location, status, failReason, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        ip: { type: string }
        userAgent: { type: string }
        location: { type: string }
        status: { type: string }
        failReason: { type: string }
        createdAt: { type: string }
    APILog:
      type: object
      required: [id, traceId, username, method, path, status, latencyMs, createdAt]
      properties:
        id: { type: integer }
        traceId: { type: string }
        username: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        latencyMs: { type: integer }
        requestBody: { type: string }
        responseBody: { type: string }
        errorStack: { type: string }
        createdAt: { type: string }
    Department:
      type: object
      required: [id, name, code, sort, leader, status]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        parentId: { type: integer, nullable: true }
        sort: { type: integer }
        leader: { type: string }
        status: { type: string }
        children: { type: array, items: { $ref: "#/components/schemas/Department" } }
    DictType:
      type: object
      required: [id, code, name, status, remark]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        status: { type: string }
        remark: { type: string }
    DictItem:
      type: object
      required: [id, typeCode, label, value, sort, status, remark]
      properties:
        id: { type: integer }
        typeCode: { type: string }
        label: { type: string }
        value: { type: string }
        sort: { type: integer }
        status: { type: string }
        remark: { type: string }
    SysConfig:
      type: object
      required: [id, key, value, name, group, remark]
      properties:
        id: { type: integer }
        key: { type: string }
        value: { type: string }
        name: { type: string }
        group: { type: string }
        remark: { type: string }
    DashboardStats:
      type: object
      required: [users, roles, permissions, dicts, configs, logs]
      properties:
        users: { type: integer }
        roles: { type: integer }
        permissions: { type: integer }
        dicts: { type: integer }
        configs: { type: integer }
        logs: { type: integer }
    DictLookup:
      type: object
      required: [code, name, items]
      properties:
        code: { type: string }
        name: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/DictItem" } }
    PageMeta:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        client: { type: string }
        captchaId: { type: string }
        captchaCode: { type: string }
        captchaToken: { type: string }
        captchaVersion: { type: string }
    RegisterRequest:
      type: object
      required: [username, password, email]
      properties:
        username: { type: string }
        password: { type: string }
        email: { type: string }
        nickname: { type: string }
        client: { type: string }
        captchaId: { type: string }
        captchaCode: { type: string }
        captchaToken: { type: string }
