openapi: 3.0.3
info:
  title: Latch Admin API
  version: 1.0.0
  description: Go + Gin + Casbin admin backend
servers:
  - url: /api/v1
paths:
  /auth/captcha:
    get:
      summary: Issue captcha
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCaptcha"
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLoginResult"
  /auth/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUser"
  /auth/menus:
    get:
      summary: Menu tree for current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMenuNodes"
  /users:
    get:
      summary: List users (paginated, data-scoped)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUserPage"
  /logs:
    get:
      summary: List operation logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: username, in: query, schema: { type: string } }
        - { name: module, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOpLogPage"
  /logs/login:
    get:
      summary: List login logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: username, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLoginLogPage"
  /logs/api:
    get:
      summary: List API request logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: traceId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAPILogPage"
  /departments:
    get:
      summary: Department tree (paginated roots)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDepartmentPage"
  /roles:
    get:
      summary: List roles
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRolePage"
  /permissions:
    get:
      summary: List permissions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePermissionPage"
  /dicts:
    get:
      summary: List dictionary types
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDictPage"
  /configs:
    get:
      summary: List system configs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: group, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfigPage"
  /dashboard/stats:
    get:
      summary: Dashboard counters
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDashboardStats"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeBase:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
    User:
      type: object
      required: [id, username, nickname, avatar, email, phone, gender, department, title, remark, status, roles]
      properties:
        id: { type: integer }
        username: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        email: { type: string }
        phone: { type: string }
        gender: { type: string }
        department: { type: string }
        title: { type: string }
        remark: { type: string }
        status: { type: string }
        lastLoginAt: { type: string, nullable: true }
        lastLoginIp: { type: string }
        permissionCodes: { type: array, items: { type: string } }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        createdAt: { type: string }
        updatedAt: { type: string }
    Role:
      type: object
      required: [id, name, code, description]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        description: { type: string }
        dataScope: { type: string }
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    Permission:
      type: object
      required: [id, name, code, path, method, kind, description]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        path: { type: string }
        method: { type: string }
        kind: { type: string }
        description: { type: string }
        parentId: { type: integer, nullable: true }
        sort: { type: integer }
        icon: { type: string }
        routePath: { type: string }
        component: { type: string }
        hidden: { type: boolean }
    MenuNode:
      type: object
      required: [id, name, code, kind, routePath, component, icon, sort, hidden]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        kind: { type: string }
        routePath: { type: string }
        component: { type: string }
        icon: { type: string }
        sort: { type: integer }
        hidden: { type: boolean }
        children: { type: array, items: { $ref: "#/components/schemas/MenuNode" } }
    OpLog:
      type: object
      required: [id, username, module, action, method, path, status, ip, latencyMs, createdAt]
      properties:
        id: { type: integer }
        traceId: { type: string }
        username: { type: string }
        module: { type: string }
        action: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        ip: { type: string }
        latencyMs: { type: integer }
        detail: { type: string }
        description: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        createdAt: { type: string }
    LoginLog:
      type: object
      required: [id, username, ip, userAgent, location, status, failReason, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        ip: { type: string }
        userAgent: { type: string }
        location: { type: string }
        status: { type: string }
        failReason: { type: string }
        createdAt: { type: string }
    APILog:
      type: object
      required: [id, traceId, username, method, path, status, latencyMs, createdAt]
      properties:
        id: { type: integer }
        traceId: { type: string }
        username: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        latencyMs: { type: integer }
        requestBody: { type: string }
        responseBody: { type: string }
        errorStack: { type: string }
        createdAt: { type: string }
    Department:
      type: object
      required: [id, name, code, sort, leader, status]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        parentId: { type: integer, nullable: true }
        sort: { type: integer }
        leader: { type: string }
        status: { type: string }
        children: { type: array, items: { $ref: "#/components/schemas/Department" } }
    DictType:
      type: object
      required: [id, code, name, status, remark]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        status: { type: string }
        remark: { type: string }
    DictItem:
      type: object
      required: [id, typeCode, label, value, sort, status, remark]
      properties:
        id: { type: integer }
        typeCode: { type: string }
        label: { type: string }
        value: { type: string }
        sort: { type: integer }
        status: { type: string }
        remark: { type: string }
    SysConfig:
      type: object
      required: [id, key, value, name, group, remark]
      properties:
        id: { type: integer }
        key: { type: string }
        value: { type: string }
        name: { type: string }
        group: { type: string }
        remark: { type: string }
    DashboardStats:
      type: object
      required: [users, roles, permissions, dicts, configs, logs]
      properties:
        users: { type: integer }
        roles: { type: integer }
        permissions: { type: integer }
        dicts: { type: integer }
        configs: { type: integer }
        logs: { type: integer }
    DictLookup:
      type: object
      required: [code, name, items]
      properties:
        code: { type: string }
        name: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/DictItem" } }
    PageMeta:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    LoginRequest:
      type: object
      required: [username, password, captchaId, captchaCode]
      properties:
        username: { type: string }
        password: { type: string }
        captchaId: { type: string }
        captchaCode: { type: string }
    CaptchaChallenge:
      type: object
      required: [captchaId, image]
      properties:
        captchaId: { type: string }
        image: { type: string }
        answer: { type: string }
    LoginResult:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string }
        expiresAt: { type: string }
        user: { $ref: "#/components/schemas/User" }
    EnvelopeUser:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/User" }
    EnvelopeCaptcha:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/CaptchaChallenge" }
    EnvelopeLoginResult:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LoginResult" }
    EnvelopeMenuNodes:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/MenuNode" } }
    EnvelopeUserPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/User" } }
    EnvelopeOpLogPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/OpLog" } }
    EnvelopeLoginLogPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/LoginLog" } }
    EnvelopeAPILogPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/APILog" } }
    EnvelopeDepartmentPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/Department" } }
    EnvelopeRolePage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/Role" } }
    EnvelopePermissionPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    EnvelopeDictPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/DictType" } }
    EnvelopeDictItemPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/DictItem" } }
    EnvelopeConfigPage:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/PageMeta"
                - type: object
                  properties:
                    items: { type: array, items: { $ref: "#/components/schemas/SysConfig" } }
    EnvelopeDashboardStats:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/DashboardStats" }
    EnvelopeDictLookup:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/DictLookup" }
